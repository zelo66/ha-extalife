config_backup:
    name: "Make controller configuration backup"
    description: "Create Exta Life controller configuration backup."
    fields:
        entity_id:
            name: "Entity"
            description: "Entity ID representing controller for which configuration backup should be created."
            example: extalife.efc_01
            required: true
            selector:
                entity:
                    filter:
                        domain: extalife
        schedule:
            name: "Schedule"
            description: "Allows to create separate backup schedules for specified periods (daily, weekly, monthly, etc.). The created config backup will contain the indicated schedule name as a part of its name."
            example: "weekly"
            required: true
            default: ""
            selector:
                select:
                    options:
                        - label: ""
                          value: ""
                        - label: "Daily"
                          value: "daily"
                        - label: "Weekly"
                          value: "weekly"
                        - label: "Monthly"
                          value: "monthly"
                        - label: "Yearly"
                          value: "yearly"
                    translation_key: "schedule"
                    mode: "dropdown"
        retention:
            name: "Retention"
            description: "Specifies how many recent backups are to be kept; if the value '0' is indicated, backup rotation will not be performed."
            required: true
            default: 0
            selector:
                number:
                    min: 0
                    max: 365
                    mode: box
        path:
            name: "Path"
            description: "Path to the directory where the backup file will be saved. If the path is left empty, then the file will be saved in the HA configuration directory in the extalife directory. If you provide a relative path, it will be appended to the HA configuration path. With an absolute path, the copy file will be saved exactly in the specified location. If the target path does not exist, it will be created."
            required: false
            default: ""
            selector:
                text:

restart:
    name: "Restart controller"
    description: "Restart controller by sending API command 150."
    fields:
        entity_id:
            name: "Entity"
            description: "Entity ID representing controller, which should be restarted"
            example: extalife.efc_01
            required: true
            selector:
                entity:
                    filter:
                        domain: extalife

refresh_state:
    name: "Refresh state"
    description: "Get the newest status for all devices and entities from controller."
    fields:
        entity_id:
            name: "Entity"
            description: "Entity ID representing controller"
            example: extalife.efc_01
            required: true
            selector:
                entity:
                    filter:
                        domain: extalife

test_button:
    name: "Test transmitter button"
    description: "Simulate Exta Life transmitter event like a button up, down, click etc."
    fields:
        entity_id:
            name: "Entity"
            description: "Entity ID representing controller"
            example: extalife.efc_01
            required: true
            selector:
                entity:
                    filter:
                        domain: extalife
        button:
            name: "Button"
            description: "Button number"
            example: "1"
            required: true
            selector:
                text:
        channel_id:
            name: "Channel"
            description: "Transmitter channel ID"
            example: "12-#"
            required: true
            selector:
                text:
        event:
            name: "Event"
            description: "Event to simulate"
            example: single
            required: true
            selector:
                select:
                    options:
                        - "single"
                        - "double"
                        - "triple"
                        - "down"
                        - "up"

record_traffic:
    name: "Record controller traffic"
    description: "Record all messages exchanged with the controller to a file in config/extalife/recordings. Login and password are removed. Useful for reporting problems and adding support for new devices."
    fields:
        entity_id:
            name: "Entity"
            description: "Entity ID representing controller"
            example: extalife.efc_01
            required: true
            selector:
                entity:
                    filter:
                        domain: extalife
        duration:
            name: "Duration"
            description: "Recording time in minutes. 0 stops the recording in progress and saves it."
            required: false
            default: 10
            selector:
                number:
                    min: 0
                    max: 180
                    unit_of_measurement: min
                    mode: box
